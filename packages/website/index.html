<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/eb-agent/assets/brand/eb-agent-64.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EBAgent - The GUI Agent Living in Your Webpage</title>
		<meta
			name="description"
			content="EBAgent: Intelligent GUI Agent for any website. Modern web AI automation with minimal integration."
		/>
		<meta
			name="keywords"
			content="EBAgent, AI Agent, GUI Agent, Web Automation, GUI Automation, Frontend, CDN, JavaScript, React, Vite, LLM"
		/>
		<meta
			property="og:image"
			content="https://equalbyte.github.io/agentic-page/assets/brand/eb-agent-light.png"
		/>
		<meta property="og:url" content="https://equalbyte.github.io/agentic-page" />
		<meta property="og:type" content="website" />
		<meta name="theme-color" content="#58c0fc" />
		<meta name="color-scheme" content="light dark" />
		<meta name="author" content="EBAgent Team" />
		<meta property="og:title" content="EBAgent - AI-powered GUI Agent" />
		<meta property="og:description" content="The GUI Agent living in your website." />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="zh_CN" />

		<!-- Google tag (gtag.js) -->
		<!-- cspell:disable -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-HCGRJTN3HM"></script>
		<script>
			window.dataLayer = window.dataLayer || []
			function gtag() {
				dataLayer.push(arguments)
			}
			gtag('js', new Date())

			gtag('config', 'G-HCGRJTN3HM')
		</script>
		<!-- cspell:enable -->
	</head>
	<body>
		<div id="root">
			<div id="sk">
				<p class="sk-text" id="sk-text">Loading...</p>
				<style>
					#sk {
						display: flex;
						align-items: center;
						justify-content: center;
						min-height: 100vh;
						background: linear-gradient(135deg, #eff6ff, #f5f3ff);
					}
					@media (prefers-color-scheme: dark) {
						#sk {
							background: linear-gradient(135deg, #111827, #1f2937);
						}
					}
					.sk-text {
						font:
							400 14px/1 system-ui,
							sans-serif;
						color: #94a3b8;
						animation: skf 2s ease-in-out infinite;
					}
					@keyframes skf {
						0%,
						100% {
							opacity: 0.6;
						}
						50% {
							opacity: 0.3;
						}
					}
				</style>
			</div>
		</div>
		<script type="module" src="./src/main.tsx"></script>
		<script>
			const updateHtmlLang = () => {
				const lang = localStorage.getItem('i18nextLng') || navigator.language || 'zh-CN'
				document.documentElement.lang = lang
				const el = document.getElementById('sk-text')
				if (el) el.textContent = lang.startsWith('zh') ? '加载中...' : 'Loading...'
			}
			updateHtmlLang()
			window.addEventListener('storage', updateHtmlLang)
		</script>
	</body>
</html>
